  :root{
    --ink:#FFFFFF;
    --btn-bg:#FFFFFF;
    --btn-fg:#1A1B1F;
    --card-bg:rgba(255,255,255,.28);
    --card-border:rgba(255,255,255,.3);
    --card-shadow:0 40px 120px rgba(0,0,0,.35);
    --input-bg:rgba(255,255,255,.22);
    --input-border:rgba(255,255,255,.4);
    --input-ph:rgba(255,255,255,.5);
    --hint:rgba(255,255,255,.55);
    --glow: 0 0 1px rgba(255,255,255,.95), 0 0 14px rgba(255,255,255,.5), 0 0 30px rgba(200,214,226,.3);
    --imgglow: drop-shadow(0 0 8px rgba(255,255,255,.55)) drop-shadow(0 0 22px rgba(200,214,226,.35));
    --imgglow-soft: drop-shadow(0 0 5px rgba(255,255,255,.28));
    --track:#2E2C33;
    --track-border:rgba(255,255,255,.25);
    --knob:#F5F6F4;
  }
  body.light{
    --ink:#000000;
    --btn-bg:#1A1B1F;
    --btn-fg:#F5F6F4;
    --card-bg:rgba(255,255,255,.6);
    --card-border:rgba(0,0,0,.07);
    --card-shadow:0 30px 90px rgba(43,66,87,.15);
    --input-bg:rgba(255,255,255,.65);
    --input-border:rgba(0,0,0,.3);
    --input-ph:rgba(0,0,0,.4);
    --hint:rgba(0,0,0,.5);
    --glow: 0 0 1px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.3), 0 0 26px rgba(0,0,0,.18);
    --imgglow: drop-shadow(0 0 6px rgba(0,0,0,.4)) drop-shadow(0 0 18px rgba(0,0,0,.22));
    --imgglow-soft: drop-shadow(0 0 4px rgba(0,0,0,.32));
    --track:#cfd6da;
    --track-border:rgba(0,0,0,.15);
    --knob:#1A1B1F;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  input,button,select,textarea{font-family:inherit;}
  body{
    background:#1A1B1F;
    color:var(--ink);
    font-family:'SayxitSans','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-weight:700;
    text-transform:uppercase;
    overflow-x:hidden;
  }
  .runway{height:300vh;}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}

  header{
    position:fixed;top:0;left:0;
    padding:24px 30px;z-index:8;pointer-events:none;
  }
  @supports (padding: env(safe-area-inset-top)){
    .burger{margin-top:env(safe-area-inset-top);}
  }
  .burger{
    pointer-events:auto;cursor:pointer;background:none;border:none;
    width:34px;height:26px;position:relative;display:block;
  }
  .burger span{
    position:absolute;left:0;width:100%;height:2px;border-radius:2px;
    background:var(--ink);
    box-shadow:0 0 8px rgba(255,255,255,.35);
    transition:transform .35s ease,opacity .3s ease,background .6s ease,top .35s ease;
  }
  body.light .burger span{box-shadow:0 0 8px rgba(0,0,0,.2);}
  .burger span:nth-child(1){top:2px;}
  .burger span:nth-child(2){top:12px;}
  .burger span:nth-child(3){top:22px;}
  body.menu-open .burger span:nth-child(1){top:12px;transform:rotate(45deg);}
  body.menu-open .burger span:nth-child(2){opacity:0;}
  body.menu-open .burger span:nth-child(3){top:12px;transform:rotate(-45deg);}
  .burger:focus-visible{outline:2px solid #8FA8C4;outline-offset:6px;}

  /* ---------- left drawer ---------- */
  .drawer-veil{
    position:fixed;inset:0;z-index:6;
    background:rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  body.menu-open .drawer-veil{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;z-index:7;
    width:min(300px,80vw);
    padding:110px 38px 42px;
    display:flex;flex-direction:column;
    background:var(--card-bg);
    border-right:1px solid var(--card-border);
    backdrop-filter:blur(40px) saturate(1.15);
    -webkit-backdrop-filter:blur(40px) saturate(1.15);
    transform:translateX(-102%);
    transition:transform .45s cubic-bezier(.3,1,.3,1),background .6s ease;
  }
  body.menu-open .drawer{transform:translateX(0);}
  .drawer nav{display:flex;flex-direction:column;gap:26px;}
  .drawer nav a{
    cursor:pointer;text-decoration:none;
    font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink);text-shadow:var(--glow);
    transition:opacity .25s ease,color .6s ease;
  }
  .drawer nav a:hover{opacity:.65;}
  .drawer .socials{
    margin-top:auto;display:flex;flex-direction:row;align-items:center;gap:18px;
  }
  .drawer .socials a{
    color:var(--ink);display:block;width:24px;height:24px;
    transition:opacity .25s ease,color .6s ease;
  }
  .drawer .socials a:hover{opacity:.6;}
  .drawer .socials svg{width:100%;height:100%;display:block;}

  /* ---------- iphone-style theme switch ---------- */
  .switch{
    position:fixed;top:26px;right:30px;z-index:5;
    pointer-events:auto;cursor:pointer;
    width:64px;height:34px;border-radius:999px;
    background:var(--track);
    border:1px solid var(--track-border);
    transition:background .5s ease,border-color .5s ease;
  }
  .switch:focus-visible{outline:2px solid #8FA8C4;outline-offset:4px;}
  .switch .icon{
    position:absolute;top:50%;transform:translateY(-50%);
    width:16px;height:16px;opacity:.75;
  }
  .switch .moon{left:9px;}
  .switch .sun{right:9px;}
  .switch .icon svg{width:100%;height:100%;display:block;}
  .switch .moon svg path{fill:#C8D6E2;}
  body.light .switch .moon svg path{fill:#1A1B1F;}
  .switch .sun svg circle, .switch .sun svg line{stroke:#8a8f93;}
  body.light .switch .sun svg circle, body.light .switch .sun svg line{stroke:#a07c1a;}
  .knob{
    position:absolute;top:3px;left:3px;
    width:26px;height:26px;border-radius:50%;
    background:var(--knob);
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    transition:transform .35s cubic-bezier(.4,1.4,.5,1),background .5s ease;
  }
  body.light .knob{transform:translateX(30px);}

  .ui{position:fixed;inset:0;pointer-events:none;z-index:2;}

  /* ---------- become-an-angel: the photo booth ---------- */
  .angel-page{
    position:fixed;inset:0;z-index:5;
    background:#FBFBFB;
    animation:pageBreathe 3.2s ease-in-out infinite;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    opacity:0;pointer-events:none;
    transition:opacity .45s ease;
  }
  body.angel-open .angel-page{opacity:1;pointer-events:auto;}
  body.angel-open .burger span{
    background:#000000;
    box-shadow:none;
  }
  body.angel-open .switch{opacity:0;pointer-events:none;}
  .switch{transition:opacity .4s ease,background .5s ease,border-color .5s ease;}
  /* the white acts as a spotlight — breathing bright */
  .angel-page::before{
    content:'';position:absolute;inset:-25%;
    background:radial-gradient(circle at 50% 45%,
      #FFFFFF 0%, #FFFFFF 30%, rgba(255,255,255,.85) 48%, rgba(255,255,255,0) 74%);
    animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.45;transform:scale(1);}
    50%{opacity:1;transform:scale(1.1);}
  }
  @keyframes pageBreathe{
    0%,100%{background:#EDEDED;}

/* ---------- background ---------- */
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMat = new THREE.ShaderMaterial({
  depthWrite:false,
  uniforms:{
    uTime:{ value:0 },
    uAspect:{ value: innerWidth/innerHeight },
    uLight:{ value:0 },
    uIntro:{ value:0 }
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader:`
    varying vec2 vUv;
    uniform float uTime;
    uniform float uAspect;
    uniform float uLight;
    uniform float uIntro;

    void main(){
      vec2 uv = vUv;
      float breathe = sin(uTime * .06) * .5 + .5;
      float x = uv.x * uAspect;

      vec3 dBase     = vec3(0.102, 0.106, 0.122);
      vec3 dCharcoal = vec3(0.180, 0.173, 0.200);
      vec3 dSlate    = vec3(0.290, 0.392, 0.471);
      vec3 dTop = mix(dBase, dCharcoal, .4 + breathe * .3);
      vec3 dBot = mix(dBase, dSlate, .16 + breathe * .08);
      vec3 cDark = mix(dTop, dBot, smoothstep(0.2, 0.95, 1. - uv.y));

      vec3 lTop  = vec3(0.706, 0.722, 0.729);
      vec3 lMid  = vec3(0.831, 0.812, 0.769);
      vec3 lBot  = vec3(0.961, 0.965, 0.957);
      vec3 lCream= vec3(0.929, 0.918, 0.890);
      vec3 lPow  = vec3(0.663, 0.776, 0.847);
      vec3 lTopC = mix(lTop, mix(lCream, lPow, .25), breathe * .35);
      vec3 cLight = mix(lTopC, lMid, smoothstep(0.35, 0.75, 1. - uv.y));
      cLight = mix(cLight, lBot, smoothstep(0.6, 1.0, 1. - uv.y));

      vec3 c = mix(cDark, cLight, uLight);

      vec3 wcol[5];
      wcol[0] = vec3(0.561, 0.659, 0.769);
      wcol[1] = vec3(0.435, 0.647, 0.690);
      wcol[2] = vec3(0.706, 0.769, 0.839);
      wcol[3] = vec3(0.624, 0.741, 0.796);
      wcol[4] = vec3(0.824, 0.863, 0.902);

      /* light-mode ribbon: soft powder blue */
      vec3 lRibbon = vec3(0.663, 0.776, 0.847);

      for(int i = 0; i < 5; i++){
        float fi = float(i);
        float baseY = .30 - fi * .055;
        float amp = .035 + fi * .012;
        float y = baseY
          + sin(x * (1.4 + fi * .35) + uTime * (.07 + fi * .02) + fi * 1.7) * amp
          + sin(x * .6 - uTime * .045 + fi) * amp * .5;
        float d = abs(uv.y - y);
        float glow = exp(-d * (85. - fi * 8.)) * (.4 - fi * .05);
        float mixT = sin(x * .5 + uTime * .05 + fi * 2.0) * .5 + .5;
        vec3 ribbonDark = mix(wcol[i], wcol[(i+2) - ((i+2)/5)*5], mixT);
        /* dark mode: additive shimmer */
        c += ribbonDark * .5 * glow * (1. - uLight);
        /* light mode: blend the blue into the field so it stays blue */
        vec3 lr = mix(lRibbon, vec3(0.431, 0.561, 0.659), mixT);
        c = mix(c, lr, clamp(glow, 0., 1.) * .8 * uLight);
      }

      gl_FragColor = vec4(c * uIntro, 1.);
    }`
});
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat));

const scene = new THREE.Scene();
const fogDark = new THREE.Color(0x1a1b1f);
const fogLight = new THREE.Color(0xe9ebea);
scene.fog = new THREE.Fog(0x1a1b1f, 12, 34);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 100);

function buildEnv(){
  const envScene = new THREE.Scene();
  const geo = new THREE.SphereGeometry(50, 32, 32);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{
      top:{ value:new THREE.Color(0x9fb4c8) },
      mid:{ value:new THREE.Color(0x51535e) },
      bot:{ value:new THREE.Color(0x2a2b31) }
    },
    vertexShader:`varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`
      varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;
      void main(){
        float h = normalize(vP).y * .5 + .5;
        vec3 c = mix(bot, mid, smoothstep(0., .5, h));
        c = mix(c, top, smoothstep(.5, 1., h));
        gl_FragColor = vec4(c, 1.);
      }`
  });
  envScene.add(new THREE.Mesh(geo, mat));
  const card = new THREE.Mesh(
    new THREE.PlaneGeometry(26, 12),
    new THREE.MeshBasicMaterial({ color:0xffffff })
  );
  card.position.set(0, 22, -6);
  card.rotation.x = Math.PI/2.4;
  envScene.add(card);
  const card2 = new THREE.Mesh(
    new THREE.PlaneGeometry(14, 20),
    new THREE.MeshBasicMaterial({ color:0xffffff })
  );
  card2.position.set(-20, 2, 8);
  card2.rotation.y = Math.PI/2.2;
  envScene.add(card2);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envMap = pmrem.fromScene(envScene, .04).texture;
  pmrem.dispose();
  return envMap;
}
scene.environment = buildEnv();

function decodeGeo(d){
  const bin = atob(d.p);
  const pq = new Int16Array(bin.length/2);
  for(let i=0;i<bin.length;i+=2){
    pq[i/2] = (bin.charCodeAt(i) | (bin.charCodeAt(i+1)<<8)) << 16 >> 16;
  }
  const posArr = new Float32Array(d.nv*3);
  for(let v=0; v<d.nv; v++){
    for(let a=0; a<3; a++){
      posArr[v*3+a] = ((pq[v*3+a] + 32768)/65535) * d.span[a] + d.min[a];
    }
  }
  const ibin = atob(d.i);
  const idx = new Uint16Array(ibin.length/2);
  for(let i=0;i<ibin.length;i+=2){
    idx[i/2] = (ibin.charCodeAt(i) | (ibin.charCodeAt(i+1)<<8)) >>> 0;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  return g;
}

/* ---------- camera path ---------- */
const KF = [
  { t:0.00, pos:[0,   .3, 9.4], look:[0, 0, 0] },
  { t:0.35, pos:[2.6, 1.4, 5.6], look:[0, .1, 0] },
  { t:0.65, pos:[-2.0,-.5, 4.4], look:[0, 0, 0] },
  { t:1.00, pos:[0,   .2, 5.0], look:[0, .1, 0] }
];
const vA = new THREE.Vector3(), vB = new THREE.Vector3(), look = new THREE.Vector3();
const ease = t => t*t*(3-2*t);

function cameraAt(p){
  let i = 0;
  while(i < KF.length-2 && p > KF[i+1].t) i++;
  const a = KF[i], b = KF[i+1];
  const t = ease(THREE.MathUtils.clamp((p - a.t)/(b.t - a.t), 0, 1));
  vA.fromArray(a.pos); vB.fromArray(b.pos);
  camera.position.lerpVectors(vA, vB, t);
  vA.fromArray(a.look); vB.fromArray(b.look);
  look.lerpVectors(vA, vB, t);
  camera.lookAt(look);
}

/* ---------- overlay fades ---------- */
const stages = [...document.querySelectorAll('.stage')].map(el=>({
  el,
  target: el.firstElementChild || el,
  a:+el.dataset.in, b:+el.dataset.fullIn,
  c:+el.dataset.fullOut, d:+el.dataset.out
}));
const hint = document.getElementById('hint');

function trapezoid(p, a, b, c, d){
  if(p <= a || p >= d) return (p <= a && a === 0) ? 1 : 0;
  if(p < b) return (p-a)/(b-a);
  if(p <= c) return 1;
  return 1 - (p-c)/(d-c);
}
function updateOverlay(p){
  for(const s of stages){
    const o = trapezoid(p, s.a, s.b, s.c, s.d);
    s.target.style.opacity = o.toFixed(3);
    s.target.style.visibility = o < .02 ? 'hidden' : 'visible'; /* iOS: faded layers can paint as grey boxes */
    s.el.style.pointerEvents = o > .5 ? 'auto' : 'none';
  }
  hint.style.opacity = p < .04 ? 1 : 0;
}

  lightTarget = lightTarget > .5 ? 0 : 1;
  document.body.classList.toggle('light', lightTarget > .5);
  modeBtn.setAttribute('aria-checked', lightTarget > .5 ? 'true' : 'false');
  spinStart = clock.elapsedTime;
});

/* ---------- intro sequencing: the world lights up ---------- */
const introStart = .3;
const INTRO_DUR = 2.0;
setTimeout(()=> document.body.classList.remove('pre'), reduceMotion ? 0 : 1900);

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const tilt = { x:0, y:0 };

function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  progress += (targetProgress - progress) * (reduceMotion ? 1 : Math.min(1, dt*5));
  mx += (tmx - mx) * dt*4;
  my += (tmy - my) * dt*4;

  /* theme blend */
  lightF += (lightTarget - lightF) * Math.min(1, dt * (reduceMotion ? 20 : 2.2));
  bgMat.uniforms.uLight.value = lightF;
  scene.fog.color.lerpColors(fogDark, fogLight, lightF);
  whiteMat.color.lerpColors(matColorDark, matColorLight, lightF);
  whiteMat.emissiveIntensity = .42 * (1 - lightF);
  pMat.color.setHex(0x8fa8c4).lerp(new THREE.Color(0xffffff), lightF * .7);
  pMat.opacity = (.35 + lightF * .1) * (reduceMotion ? 1 : ease(THREE.MathUtils.clamp((t - introStart) / INTRO_DUR, 0, 1)));
  amb.intensity = .3 + lightF * .35;

  cameraAt(progress);
  if(!reduceMotion){
    const par = THREE.MathUtils.smoothstep(progress, 0.005, 0.07);
    camera.position.x += mx * .5 * par;
    camera.position.y -= my * .35 * par;
    camera.lookAt(look);
  }

  const idle = 1 - THREE.MathUtils.smoothstep(progress, 0.005, 0.07);

  const ik = reduceMotion ? 1 : THREE.MathUtils.clamp((t - introStart) / INTRO_DUR, 0, 1);
  const introE = ease(ik);

  const bobY = Math.sin(t * .5) * .045;
  const swayY = Math.sin(t * .22) * .5;
  const swayX = Math.sin(t * .34 + 1.3) * .14;

  /* mouse tilt — stronger, and mirrored so the near side leans away */
  const targetTiltX = my * .6 * idle;
  const targetTiltY = mx * .6 * idle;
  tilt.x += (targetTiltX - tilt.x) * Math.min(1, dt*3.5);
  tilt.y += (targetTiltY - tilt.y) * Math.min(1, dt*3.5);

  /* toggle flourish */
  const spinT = THREE.MathUtils.clamp((t - spinStart) / 1.2, 0, 1);
  const spinRot = reduceMotion ? 0 : ease(spinT) * Math.PI * 2;
  const spinScale = 1 + (reduceMotion ? 0 : Math.sin(spinT * Math.PI) * .1);
  const beat2 = Math.exp(-Math.pow((progress - .39) / .12, 2)); /* the wordmark beat */
  const swell = 1 + beat2 * 2; /* 3x at the peak */
  crystal.scale.setScalar(1.35 * spinScale * (.86 + .14 * introE) * swell);

  /* ---- ignition: the logo lights up out of the dark ---- */
  whiteMat.emissiveIntensity = (.42 * (1 - lightF)) * (.02 + .98 * introE);
  whiteMat.envMapIntensity = .1 + 1.1 * introE;
  key.intensity = 1.7 * introE;

  crystal.position.set(0, (reduceMotion ? 0 : bobY) - (1 - introE) * .5 - beat2 * 1.9, 0);

  if(reduceMotion){
    crystal.rotation.set(0, 0, 0);
  } else {
    crystal.rotation.y = swayY * idle + Math.sin(progress * Math.PI) * 1.15 * (1 - idle) + tilt.y + spinRot - (1 - introE) * 1.3;
    crystal.rotation.x = swayX * idle + Math.sin(progress * Math.PI * 2) * .3 * (1 - idle) + tilt.x;
    crystal.rotation.z = Math.sin(t * .16) * .07 * idle + Math.sin(progress * Math.PI) * .18 * (1 - idle);
  }

  if(!reduceMotion){
    const arr = pGeo.attributes.position.array;
    for(let i=0;i<P;i++){
      arr[i*3+1] += dt * .1;
      if(arr[i*3+1] > 8) arr[i*3+1] = -8;
    }
    pGeo.attributes.position.needsUpdate = true;
  }

  bgMat.uniforms.uTime.value = reduceMotion ? 0 : t;
  bgMat.uniforms.uIntro.value = reduceMotion ? 1 : introE;

  updateOverlay(progress);

  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.clearDepth();
  renderer.render(scene, camera);

  boothTick(dt, t);

  requestAnimationFrame(frame);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  bgMat.uniforms.uAspect.value = innerWidth/innerHeight;
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- photo booth camera ---------- */
const booth = document.getElementById('booth');
const boothVideo = document.getElementById('boothVideo');
const boothMsg = document.getElementById('boothMsg');
const haloCanvas = document.getElementById('haloCanvas');
/* Instagram/TikTok/Facebook in-app browsers block the camera */
const IN_APP = /instagram|fban|fbav|fb_iab|tiktok|musical_ly|snapchat|line\/|twitter/i.test(navigator.userAgent);

let boothStream = null;
let boothActive = false;
let boothLive = false;
let boothMode = 'angel';   /* 'normal' | 'angel' | 'digital' — extensible */
let feedMirrored = true;   /* camera = mirrored selfie; uploaded file = not */

/* --- halo mini-scene: the star-ring as an angel halo (multi-face) --- */
const hRenderer = new THREE.WebGLRenderer({ canvas: haloCanvas, alpha:true, antialias:true, preserveDrawingBuffer:true });
hRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const hScene = new THREE.Scene();
let hCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 500);

/* tuned to the mechanic from angel.html: lift ~0.85 head-widths, ring ~1.5 head-widths */
const HALO_CFG = { lift:.75, width:1.16, posAlpha:.09, scaleAlpha:.1, rotAlpha:.07 };
const HALO_MAX = 4;

/* re-center the halo copy on the ring's exact circle center (fitted: 0.2911, 0.2681, r=1.0089) */
const haloGeo = solidGeo.clone();
haloGeo.translate(-0.2911, -0.2681, 0);
const RING_R = 1.0089;

const haloMat = new THREE.MeshStandardMaterial({
  color:0xffffff, roughness:.4, metalness:0,
  emissive:0xffffff, emissiveIntensity:.38
});
hScene.add(new THREE.HemisphereLight(0xffffff, 0xb8bfc6, 1.3));
const haloKey = new THREE.DirectionalLight(0xffffff, 1.0);
haloKey.position.set(-120, 260, 300);
hScene.add(haloKey);
const haloUnits = [];
for(let i=0;i<HALO_MAX;i++){
  const tiltG = new THREE.Group();
  const spinG = new THREE.Group();
  spinG.add(new THREE.Mesh(haloGeo, haloMat));
  tiltG.add(spinG);
  tiltG.rotation.x = -1.45;
  tiltG.visible = false;
  hScene.add(tiltG);
  haloUnits.push({ tiltG, spinG, x:0, y:0, s:80, rx:0, ry:0, rz:0, seen:0, active:false });
}

function sizeHalo(){
  const cw = haloCanvas.clientWidth, ch = haloCanvas.clientHeight;
  if(!cw || !ch) return;
  hRenderer.setSize(cw, ch, false);
  hCam.left = -cw/2; hCam.right = cw/2; hCam.top = ch/2; hCam.bottom = -ch/2;
  hCam.updateProjectionMatrix();
}
addEventListener('resize', sizeHalo);

/* map a normalized video point into our mirrored, cover-fit canvas (ortho px) */
function vidToCanvas(nx, ny){
  const cw = haloCanvas.clientWidth, ch = haloCanvas.clientHeight;
  const vw = boothVideo.videoWidth, vh = boothVideo.videoHeight;
  const s = Math.max(cw/vw, ch/vh);
  const ox = (vw*s - cw)/2, oy = (vh*s - ch)/2;
  let cx = nx*vw*s - ox;
  if(feedMirrored) cx = cw - cx;
  const cy = ny*vh*s - oy;
  return { x: cx - cw/2, y: ch/2 - cy, s };
}

/* --- tracking: MediaPipe FaceMesh (as in angel.html) -> FaceDetector -> fixed --- */
let mpMesh = null, mpBusy = false;
let faceTargets = [];  /* [{x,y,s}] in ortho px */
let facePolys = [];    /* person outlines in raw video space */
let lastFaceSeen = 0;

function initMP(){
  if(!window.FaceMesh || mpMesh) return !!mpMesh;
  try{
    mpMesh = new window.FaceMesh({ locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
    mpMesh.setOptions({
      maxNumFaces: HALO_MAX,
      refineLandmarks: false,
      minDetectionConfidence: .3,
      minTrackingConfidence: .4
    });
    mpMesh.onResults(res=>{
      const list = res.multiFaceLandmarks || [];
      const vw = boothVideo.videoWidth, vh = boothVideo.videoHeight;

      /* person outline in raw video space, for the ascii mask.
         if the face is briefly hidden (hand in front), remember the last one */
      const OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
      if(!list.length){
        if(performance.now() - lastFaceSeen > 1200) facePolys = [];
      } else {
        lastFaceSeen = performance.now();
      }
      if(list.length) facePolys = list.map(lm=>{
        const pts = OVAL.map(ix=>({ x: lm[ix].x, y: lm[ix].y }));
        let cx = 0, cy = 0, jaw = 0;
        for(const p of pts){ cx += p.x; cy += p.y; jaw = Math.max(jaw, p.y); }
        cx /= pts.length; cy /= pts.length;
        const fw = Math.abs(lm[356].x - lm[127].x);
        return { pts, cx, cy, jaw, fw };
      });

      const cand = list.map(lm=>{
        const L = lm[127], R = lm[356];              /* temple to temple */
        const top = lm[10], brow = lm[151] || lm[9]; /* forehead anchors */
        const chin = lm[152];
        const a = vidToCanvas((top.x + brow.x)/2, Math.min(top.y, brow.y));
        const l = vidToCanvas(L.x, L.y), r = vidToCanvas(R.x, R.y);

        /* 3D temple distance: doesn't shrink when the head turns */
        const d3 = Math.hypot(
          (R.x - L.x) * vw,
          (R.y - L.y) * vh,
          ((R.z || 0) - (L.z || 0)) * vw
        ) * a.s;

        /* head orientation, so the halo behaves like it's attached above the head */
        /* ear-to-shoulder tilt — normalized to the line's angle so the
           mirrored point order can't flip it by 180 degrees */
        let roll = Math.atan2(r.y - l.y, r.x - l.x);
        if(roll > Math.PI/2) roll -= Math.PI;
        if(roll < -Math.PI/2) roll += Math.PI;
        /* turning left/right — denominator kept positive so mirrored point
           order can't flip the angle by 180 degrees; only depth drives it */
        const yaw = Math.atan2(((L.z || 0) - (R.z || 0)) * vw * a.s, Math.abs(r.x - l.x));
        const upY = (chin.y - top.y) * vh * a.s;                          /* up the face, in px */
        const upZ = ((top.z || 0) - (chin.z || 0)) * vw * a.s;
        const pitch = Math.atan2(upZ, Math.max(1, upY));                  /* chin up/down */

        /* anchor on the cranium, not the face: temple midpoint pushed away
           from the nose, so turning the head keeps the halo over the skull */
        const noseC = vidToCanvas(lm[1].x, lm[1].y);
        const midX = (l.x + r.x) / 2;
        const headX = midX - (noseC.x - midX) * .55;

        const chinC = vidToCanvas(chin.x, chin.y);
        const topC = vidToCanvas(top.x, top.y);
        const faceH3 = Math.hypot(
          (top.x - chin.x) * vw,
          (top.y - chin.y) * vh,
          ((top.z || 0) - (chin.z || 0)) * vw
        ) * a.s;
        /* the deeper the tilt, the more clearance the halo keeps above the crown */
        const tiltBoost = 1 + Math.min(.5, Math.abs(roll) * .6);
        const k = HALO_CFG.lift * tiltBoost * d3 / Math.max(1, faceH3);
        return {
          x: headX + (topC.x - chinC.x) * k * .95,
          y: a.y + (topC.y - chinC.y) * k,
          s: d3 * HALO_CFG.width / 2,
          rx: THREE.MathUtils.clamp(-pitch * .9, -1.45, 1.45),
          ry: THREE.MathUtils.clamp(yaw, -1.25, 1.25), /* head twist -> star orbits the ring */
          rz: THREE.MathUtils.clamp(roll * .75, -.7, .7)
        };
      }).sort((p,q)=>q.s - p.s);
      /* dedupe: MediaPipe can report the same face twice at extreme angles */
      const kept = [];
      for(const f of cand){
        const dup = kept.some(g => Math.hypot(g.x - f.x, g.y - f.y) < Math.max(g.s, f.s) * 1.6);
        if(!dup) kept.push(f);
        if(kept.length >= HALO_MAX) break;
      }
      faceTargets = kept;
    });
    return true;
  }catch(e){ mpMesh = null; return false; }
}

/* --- person segmentation: glyphs only on the body, never the room --- */
let segNet = null, segBusy = false, haveMask = false;
const segMaskCanvas = document.createElement('canvas');
const segMaskCtx = segMaskCanvas.getContext('2d');

let segWarned = false;
function initSeg(){
  if(!window.SelfieSegmentation){
    if(!segWarned){ console.warn('sayxit: SelfieSegmentation not loaded — ascii not body-gated'); segWarned = true; }
    return false;
  }
  if(segNet) return true;
  try{
    segNet = new window.SelfieSegmentation({ locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}` });
    segNet.setOptions({ modelSelection: 1 });
    segNet.onResults(res=>{
      const vw = boothVideo.videoWidth, vh = boothVideo.videoHeight;
      if(!vw || !vh) return;
      segMaskCanvas.width = 320;
      segMaskCanvas.height = Math.round(320 * vh / vw);
      segMaskCtx.drawImage(res.segmentationMask, 0, 0, segMaskCanvas.width, segMaskCanvas.height);
      haveMask = true;
    });
    return true;
  }catch(e){ segNet = null; return false; }
}

let trackTickN = 0;

const faceDetector = ('FaceDetector' in window)
  ? new window.FaceDetector({ fastMode:true, maxDetectedFaces:1 })
  : null;
let detectBusy = false;

function fallbackTarget(){
  const cw = haloCanvas.clientWidth, ch = haloCanvas.clientHeight;
  faceTargets = [{ x:0, y: ch*.27, s: cw*.1, rx:0, ry:0, rz:0 }];
}

async function trackFace(){
  if(!boothActive || (boothMode === 'normal' && !fxOpen)) return;
  const vw = boothVideo.videoWidth, vh = boothVideo.videoHeight;
  if(!vw || !vh){ return; }

  trackTickN++;

  if(initMP()){
    if(mpBusy) return;
    mpBusy = true;
    try{ await mpMesh.send({ image: boothVideo }); }catch(e){}
    mpBusy = false;
    return;
  }
  if(faceDetector){
    if(detectBusy) return;
    detectBusy = true;
    try{
      const faces = await faceDetector.detect(boothVideo);
      if(faces.length){
        const b = faces[0].boundingBox;
        const c = vidToCanvas((b.x + b.width/2)/vw, b.y/vh);
        const w = b.width * c.s;
        faceTargets = [{ x:c.x, y:c.y + w*.3, s:w*.42, rx:0, ry:0, rz:0 }];
      }
    }catch(e){ fallbackTarget(); }
    detectBusy = false;
    return;
  }
  fallbackTarget();
}
setInterval(trackFace, 100);

/* called every frame from the main loop */
function boothTick(dt, t){
  if(!boothActive || !boothLive) return;

  /* effects grid open: preview every filter live on its tile */
  if(fxOpen){
    angelTick(dt, t);
    digitalTick(dt, t);
    if(fxAngelCtx){
      fxAngelCtx.clearRect(0, 0, FXW, FXH);
      fxAngelCtx.drawImage(haloCanvas, 0, 0, FXW, FXH);
    }
    if(fxDigCtx){
      fxDigCtx.clearRect(0, 0, FXW, FXH);
      fxDigCtx.drawImage(asciiCanvas, 0, 0, FXW, FXH);
    }
    return;
  }

  if(boothMode === 'digital'){
    haloUnits.forEach(u=>{ u.active = false; u.tiltG.visible = false; });
    hRenderer.render(hScene, hCam);
    digitalTick(dt, t);
    return;
  }
  if(asciiCanvas.width) actx.clearRect(0, 0, asciiCanvas.width, asciiCanvas.height);
  if(boothMode === 'normal'){
    haloUnits.forEach(u=>{ u.active = false; u.tiltG.visible = false; });
    hRenderer.render(hScene, hCam);
    return;
  }
  angelTick(dt, t);
}

function angelTick(dt, t){

  /* match faces to units by proximity, so list reordering can't double a halo */
  const claimed = new Set();
  const assignment = new Array(HALO_MAX).fill(null);
  for(let i=0;i<HALO_MAX;i++){
    const u = haloUnits[i];
    if(!u.active) continue;
    let best = -1, bestD = 1e9;
    for(let j=0;j<faceTargets.length;j++){
      if(claimed.has(j)) continue;
      const f = faceTargets[j];
      const d = Math.hypot(f.x - u.x, f.y - u.y);
      if(d < bestD && d < Math.max(140, f.s * 2.5)){ bestD = d; best = j; }
    }
    if(best >= 0){ claimed.add(best); assignment[i] = faceTargets[best]; }
  }
  for(let j=0;j<faceTargets.length;j++){
    if(claimed.has(j)) continue;
    const slot = haloUnits.findIndex((u,i)=>!u.active && assignment[i]===null);
    if(slot < 0) break;
    assignment[slot] = faceTargets[j];
    claimed.add(j);
  }

  for(let i=0;i<HALO_MAX;i++){
    const u = haloUnits[i];
    const tgt = assignment[i];
    if(tgt){
      if(!u.active){
        u.x = tgt.x; u.y = tgt.y; u.s = tgt.s;
        u.rx = tgt.rx; u.ry = tgt.ry; u.rz = tgt.rz;
        u.active = true;
      }
      u.x += (tgt.x - u.x) * HALO_CFG.posAlpha;
      u.y += (tgt.y - u.y) * HALO_CFG.posAlpha;
      u.s += (tgt.s - u.s) * HALO_CFG.scaleAlpha;
      u.rx += (tgt.rx - u.rx) * HALO_CFG.rotAlpha;
      u.ry += (tgt.ry - u.ry) * HALO_CFG.rotAlpha;
      u.rz += (tgt.rz - u.rz) * HALO_CFG.rotAlpha;
      u.seen = t;
    } else if(t - u.seen > .45){
      u.active = false; /* prune, like angel.html's 450ms */
    }

    u.tiltG.visible = u.active;
    if(!u.active) continue;

    /* the halo rides the head: follows it and takes on its angles */
    u.tiltG.position.set(u.x, u.y, 0);
    u.tiltG.scale.setScalar(u.s / RING_R); /* sized by the ring itself */
    u.tiltG.rotation.order = 'ZYX';
    u.tiltG.rotation.x = -1.45 + u.rx;
    u.tiltG.rotation.y = 0;
    u.tiltG.rotation.z = u.rz;
    u.spinG.rotation.z = u.ry; /* the twist lives in the ring's own plane */
  }

  hRenderer.render(hScene, hCam);
}

/* ---------- I Am Digital: living ascii over the face ---------- */
const asciiCanvas = document.getElementById('asciiCanvas');
const actx = asciiCanvas.getContext('2d');
const sampleCanvas = document.createElement('canvas');
const sampCtx = sampleCanvas.getContext('2d', { willReadFrequently:true });
let digitalBufs = null;
const maskSamp = document.createElement('canvas');
const maskSampCtx = maskSamp.getContext('2d', { willReadFrequently:true });

const IS_MOBILE = window.innerWidth <= 640;
let digiFrameN = 0;
const ASCII = {
  gridW: 195,            /* cells across */
  cellAspect: 1.75,      /* monospace glyphs are taller than wide */
  threshold: .32,        /* how bright a cell must be to earn a glyph */
  baseAmbient: .62,      /* strong floor anywhere on the tracked body */
  ramp: ['\u00b7','-','+','#','#']
};

function sizeAscii(){
  const cw = asciiCanvas.clientWidth, ch = asciiCanvas.clientHeight;
  if(!cw || !ch) return;
  asciiCanvas.width = cw; asciiCanvas.height = ch;
}
addEventListener('resize', sizeAscii);

/* deterministic per-block randomness: glyphs arrive in patches, not confetti */
function blockRand(bx, by){
  const v = Math.sin(bx * 127.1 + by * 311.7) * 43758.5453;
  return v - Math.floor(v);
}

function digitalTick(dt, t){
  if(IS_MOBILE && (digiFrameN++ % 2)) return; /* phones: refresh glyphs at half rate */
  const cw = asciiCanvas.width, ch = asciiCanvas.height;
  if(!cw || !ch){ sizeAscii(); return; }
  if(boothVideo.readyState < 2) return;

  const gw = IS_MOBILE ? 96 : (cw < 600 ? 120 : ASCII.gridW);
  const cellW = cw / gw;
  const cellH = cellW * ASCII.cellAspect;
  const gh = Math.ceil(ch / cellH);

  if(sampleCanvas.width !== gw || sampleCanvas.height !== gh){
    sampleCanvas.width = gw; sampleCanvas.height = gh;
  }
  sampCtx.drawImage(boothVideo, 0, 0, gw, gh);
  const px = sampCtx.getImageData(0, 0, gw, gh).data;

  /* no face, no glyphs: the filter reads people, not rooms */
  if(!facePolys.length){
    actx.clearRect(0, 0, cw, ch);
    return;
  }

  if(maskSamp.width !== gw || maskSamp.height !== gh){
    maskSamp.width = gw; maskSamp.height = gh;
  }
  maskSampCtx.filter = 'blur(1.2px)';
  maskSampCtx.fillStyle = '#000';
  maskSampCtx.fillRect(0, 0, gw, gh);
  for(const fp of facePolys){
    /* face oval, padded to catch the hair — red channel */
    maskSampCtx.fillStyle = '#f00';
    maskSampCtx.beginPath();
    fp.pts.forEach((p, pi)=>{
      const ex = (fp.cx + (p.x - fp.cx) * 1.22) * gw;
      const ey = (fp.cy + (p.y - fp.cy) * 1.28) * gh;
      pi ? maskSampCtx.lineTo(ex, ey) : maskSampCtx.moveTo(ex, ey);
    });
    maskSampCtx.closePath();
    maskSampCtx.fill();
    /* torso wedge from the jaw to the bottom of frame — green channel */
    maskSampCtx.fillStyle = '#0f0';
    maskSampCtx.beginPath();
    maskSampCtx.moveTo((fp.cx - fp.fw * 1.2) * gw, fp.jaw * gh);
    maskSampCtx.lineTo((fp.cx + fp.fw * 1.2) * gw, fp.jaw * gh);
    maskSampCtx.lineTo((fp.cx + fp.fw * 2.2) * gw, gh);
    maskSampCtx.lineTo((fp.cx - fp.fw * 2.2) * gw, gh);
    maskSampCtx.closePath();
    maskSampCtx.fill();
  }
  maskSampCtx.filter = 'none';
  const mk = maskSampCtx.getImageData(0, 0, gw, gh).data;

  /* sample your live skin tone from the face centre: whatever matches it
     anywhere in frame is you — hands, arms, neck — no extra model needed */
  let snr = -1, sng = 0, faceLum = .5;
  {
    const fp = facePolys[0];
    const cxg = Math.max(1, Math.min(gw - 2, Math.round(fp.cx * gw)));
    const cyg = Math.max(1, Math.min(gh - 2, Math.round(fp.cy * gh)));
    let r = 0, g = 0, b = 0;
    for(let dy = -1; dy <= 1; dy++){
      for(let dx = -1; dx <= 1; dx++){
        const ii = ((cyg + dy) * gw + (cxg + dx)) * 4;
        r += px[ii]; g += px[ii + 1]; b += px[ii + 2];
      }
    }
    const s = r + g + b;
    if(s > 90){ snr = r / s; sng = g / s; }
    /* face brightness anchors the whole exposure */
    faceLum = (r * .299 + g * .587 + b * .114) / (9 * 255);
  }
  const normF = .62 / Math.max(.12, faceLum);

  actx.clearRect(0, 0, cw, ch);
  actx.font = `700 ${Math.ceil(cellH * 1.05)}px 'Courier New',monospace`;
  actx.textAlign = 'center';
  actx.textBaseline = 'middle';
  actx.fillStyle = '#F2E7CE';
  if(IS_MOBILE){
    actx.shadowBlur = 0; /* shadow blur is brutal on mobile GPUs */
  } else {
    actx.shadowColor = 'rgba(255,240,210,.85)';
    actx.shadowBlur = cellH * .55;
  }

  /* ---- pass 1: classify every cell (shape / skin / brightness) ---- */
  const nCells = gw * gh;
  if(!digitalBufs || digitalBufs.n !== nCells){
    digitalBufs = { n: nCells,
      lumArr: new Float32Array(nCells),
      shapeArr: new Float32Array(nCells),
      skinArr: new Float32Array(nCells),
      conn: new Uint8Array(nCells),
      queue: new Int32Array(nCells) };
  }
  const { lumArr, shapeArr, skinArr, conn, queue } = digitalBufs;
  conn.fill(0);
  let qLen = 0;

  for(let c = 0; c < nCells; c++){
    const i = c * 4;
    const lum = (px[i] * .299 + px[i+1] * .587 + px[i+2] * .114) / 255;
    lumArr[c] = lum;
    const mR = mk[i] / 255, mG = mk[i + 1] / 255;
    const m = Math.max(mR, mG);
    shapeArr[c] = m >= .7 ? m : 0;
    let skin = 0;
    if(snr >= 0 && lum >= .12){
      const csum = px[i] + px[i+1] + px[i+2];
      const maxc = Math.max(px[i], px[i+1], px[i+2]);
      const minc = Math.min(px[i], px[i+1], px[i+2]);
      if(csum > 45 && (maxc - minc) / Math.max(1, maxc) > .19){
        const d = Math.hypot(px[i] / csum - snr, px[i+1] / csum - sng);
        if(d < .075){
          skin = Math.min(1, (1 - d / .075) * 1.6);
          if(lum < .22) skin *= .7;
        }
      }
    }
    skinArr[c] = skin;
    if(shapeArr[c] > 0){ conn[c] = 1; queue[qLen++] = c; }
  }

  /* ---- flood: only skin that connects back to the body counts as you ---- */
  let qHead = 0;
  while(qHead < qLen){
    const c = queue[qHead++];
    const cx0 = c % gw, cy0 = (c / gw) | 0;
    for(let dy = -1; dy <= 1; dy++){
      const yy = cy0 + dy;
      if(yy < 0 || yy >= gh) continue;
      for(let dx = -1; dx <= 1; dx++){
        const xx = cx0 + dx;
        if(xx < 0 || xx >= gw) continue;
        const cc = yy * gw + xx;
        if(conn[cc] || skinArr[cc] < .35) continue; /* only confident skin carries the chain */
        conn[cc] = 1;
        queue[qLen++] = cc;
      }
    }
  }

  /* ---- pass 2: draw ---- */
  for(let y = 0; y < gh; y++){
    for(let x = 0; x < gw; x++){
      const c = y * gw + x;
      const lum = lumArr[c];
      if(lum < .12) continue;

      let mEdge = 0;
      const mR = mk[c * 4] / 255;
      if(shapeArr[c] > 0) mEdge = shapeArr[c];
      else if(conn[c] && skinArr[c] > 0) mEdge = skinArr[c];
      if(mEdge < .3) continue;

      const sx = feedMirrored ? cw - (x + .5) * cellW : (x + .5) * cellW;
      const sy = (y + .5) * cellH;

      const pr = blockRand(Math.floor(x / 3), Math.floor(y / 3));
      const flick = .35 + .65 * pr; /* fixed per patch: glyphs move only when you do */

      const weight = shapeArr[c] > 0 ? (.55 + .2 * mR) : .85;

      const lumA = Math.min(1, lum * normF); /* brightness relative to your face */
      if(Math.pow(lumA, 1.1) * weight * flick * mEdge < ASCII.threshold) continue;

      /* rarely, the noise spells its name */
      if(pr > .982 && pr < .987 && Math.sin(t * .3 + pr * 500) > .92){
        actx.fillText('sayxit', sx, sy);
        continue;
      }

      const ci = Math.min(ASCII.ramp.length - 1, Math.floor(lumA * ASCII.ramp.length));
      const glyph = pr > .93 ? String(Math.floor(pr * 100) % 10) : ASCII.ramp[ci];
      actx.fillText(glyph, sx, sy);
    }
  }
}

function adjustScreenAspect(){
  if(window.innerWidth > 640) return;
  const vw = boothVideo.videoWidth, vh = boothVideo.videoHeight;
  if(!vw || !vh) return;
  /* landscape feed into a tall frame = heavy crop; go squarer instead */
  document.getElementById('screen').style.aspectRatio = vw > vh ? '5 / 6' : '7 / 10';
  requestAnimationFrame(()=>{ sizeHalo(); sizeAscii(); });
}
boothVideo.addEventListener('loadedmetadata', adjustScreenAspect);

async function startBooth(){
  if(boothStream) return;
  boothMsg.textContent = 'allow camera access';
  boothMsg.classList.remove('off');
  try{
    boothStream = await navigator.mediaDevices.getUserMedia({
      video: window.innerWidth <= 640
        ? { width:{ideal:960}, height:{ideal:1280}, facingMode:'user' }
        : { width:{ideal:1280}, height:{ideal:720}, facingMode:'user' },
      audio:false
    });
    boothVideo.srcObject = boothStream;
    boothMsg.classList.add('off');
    await new Promise(res=>{
      if(boothVideo.readyState >= 2) return res();
      boothVideo.onloadedmetadata = res;
    });
    booth.classList.add('open');   /* point -> line -> screen */
    requestAnimationFrame(sizeAscii);
    if(reduceMotion){ booth.classList.add('live'); boothLive = true; }
    boothActive = true;
    requestAnimationFrame(sizeHalo);
    fallbackTarget();
  }catch(err){
    boothMsg.textContent = 'camera unavailable — check permissions';
  }
}
booth.addEventListener('animationend', e=>{
  if(e.animationName === 'crtOpen'){
    booth.classList.add('live');
    boothLive = true;
  }
});

function stopBooth(){
  stopRec();
  hideCapture();
  boothActive = false;
  boothLive = false;
  haloUnits.forEach(u=>{ u.active = false; u.tiltG.visible = false; });
  hRenderer.clear();
  booth.classList.remove('open', 'live', 'digital', 'file', 'fs');
  if(fileUrl){ URL.revokeObjectURL(fileUrl); fileUrl = null; boothVideo.src = ''; }
  feedMirrored = true;
  cameraBtn.style.display = 'none';
  uploadBtn.style.display = '';
  if(boothStream){
    boothStream.getTracks().forEach(tr=>tr.stop());
    boothStream = null;
    boothVideo.srcObject = null;
  }
}

document.getElementById('navHome').addEventListener('click', ()=>{
  setMenu(false);
  document.body.classList.remove('angel-open');
  stopBooth();
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
});
const fxgrid = document.getElementById('fxgrid');
let fxOpen = false;
let fxAngelCtx = null, fxDigCtx = null;
const FXW = 480, FXH = 270;

/* photobooth-style grid: normal in the centre, filters around, room to grow */
const FILTERS = [
  null, { mode:'angel', label:'Become An Angel' }, null,
  { mode:'digital', label:'I Am Digital', graded:true }, { mode:'normal', label:'Normal' }, null,
  null, null, null
];
let gridBuilt = false;

function buildFxGrid(){
  if(gridBuilt) return;
  gridBuilt = true;
  for(const f of FILTERS){
    if(!f){
      const cell = document.createElement('div');
      cell.className = 'fxcell soon';
      fxgrid.appendChild(cell);
      continue;
    }
    const cell = document.createElement('button');
    cell.className = 'fxcell' + (f.graded ? ' graded' : '');
    cell.dataset.mode = f.mode;
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.autoplay = true;
    const lab = document.createElement('span');
    lab.textContent = f.label;
    cell.appendChild(v);
    if(f.mode !== 'normal'){
      const oc = document.createElement('canvas');
      oc.className = 'fxov';
      oc.width = FXW; oc.height = FXH;
      cell.appendChild(oc);
      if(f.mode === 'angel') fxAngelCtx = oc.getContext('2d');
      if(f.mode === 'digital') fxDigCtx = oc.getContext('2d');
    }
    cell.appendChild(lab);
    cell.addEventListener('click', ()=> setBoothMode(f.mode));
    fxgrid.appendChild(cell);
  }
}

function fxFeeds(on){
  fxgrid.querySelectorAll('.fxcell video').forEach(v=>{
    if(on){
      v.parentElement.classList.toggle('mirror', feedMirrored);
      if(boothStream){ v.srcObject = boothStream; }
      else if(fileUrl){ v.srcObject = null; v.src = fileUrl; v.loop = true; }
      v.play().catch(()=>{});
    } else {
      v.pause();
      v.srcObject = null;
      v.removeAttribute('src');
    }
  });
}

function fxMark(){
  fxgrid.querySelectorAll('.fxcell[data-mode]').forEach(c=>{
    c.classList.toggle('on', c.dataset.mode === boothMode);
  });
}

function setBoothMode(mode){
  boothMode = mode;
  booth.classList.toggle('digital', mode === 'digital');
  fxMark();
  fxgrid.classList.remove('open');
  fxOpen = false;
  fxFeeds(false);
}

document.getElementById('fxbtn').addEventListener('click', ()=>{
  buildFxGrid();
  const opening = !fxgrid.classList.contains('open');
  fxgrid.classList.toggle('open', opening);
  fxOpen = opening;
  if(opening){ fxMark(); fxFeeds(true); }
  else fxFeeds(false);
});
document.getElementById('dotFull').addEventListener('click', ()=>{
  if(booth.requestFullscreen){
    if(document.fullscreenElement) document.exitFullscreen();
    else booth.requestFullscreen();
  } else {
    /* iPhones: no element fullscreen API — fake it */
    const on = booth.classList.toggle('fs');
    document.body.classList.toggle('booth-fs', on);
    requestAnimationFrame(()=>{ sizeHalo(); sizeAscii(); });
  }
});
document.addEventListener('fullscreenchange', ()=>{
  document.body.classList.toggle('booth-fs', !!document.fullscreenElement);
});
document.addEventListener('fullscreenchange', ()=>{
  requestAnimationFrame(()=>{ sizeHalo(); sizeAscii(); });
});

/* ---------- the red button: 3..2..1 then capture ---------- */
const count3 = document.getElementById('count3');
let counting = false;

document.getElementById('shutter').addEventListener('click', ()=>{
  if(!boothActive) return;
  if(recording){ stopRec(); return; }
  if(counting) return;
  counting = true;
  let n = 3;
  count3.textContent = n;
  const tick = setInterval(()=>{
    n--;
    if(n > 0){
      count3.textContent = n;
    } else {
      clearInterval(tick);
      count3.textContent = '';
      counting = false;
      if(captureMode === 'video') startRec();
      else doCapture();
    }
  }, 800);
});

function drawComposite(octx, cw, ch){
  /* the feed, cover-fit, mirrored if live */
  const vw = boothVideo.videoWidth, vh = boothVideo.videoHeight;
  const s = Math.max(cw / vw, ch / vh);
  const dw = vw * s, dh = vh * s;
  const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
  octx.save();
  if(boothMode === 'digital') octx.filter = 'sepia(.5) saturate(.6) contrast(1.14) brightness(.88)';
  if(feedMirrored){ octx.translate(cw, 0); octx.scale(-1, 1); }
  octx.drawImage(boothVideo, dx, dy, dw, dh);
  octx.restore();
  if(boothMode === 'digital'){
    const g = octx.createRadialGradient(cw/2, ch/2, Math.min(cw,ch)*.35, cw/2, ch/2, Math.max(cw,ch)*.72);
    g.addColorStop(0, 'rgba(12,9,6,0)');
    g.addColorStop(1, 'rgba(12,9,6,.6)');
    octx.fillStyle = g;
    octx.fillRect(0, 0, cw, ch);
  }
  octx.drawImage(haloCanvas, 0, 0, cw, ch);
  octx.drawImage(asciiCanvas, 0, 0, cw, ch);
}

function doCapture(){
  const scr = document.getElementById('screen');
  const cw = scr.clientWidth, ch = scr.clientHeight;
  if(!cw || !boothVideo.videoWidth) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const out = document.createElement('canvas');
  out.width = cw * dpr; out.height = ch * dpr;
  const octx = out.getContext('2d');
  octx.scale(dpr, dpr);
  drawComposite(octx, cw, ch);

  const flash = document.getElementById('flash');
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');

  out.toBlob(blob=>{
    if(!blob) return;
    showCapture(blob, `sayxit-${boothMode}-${Date.now()}.png`, 'image/png', false);
  }, 'image/png');
}

/* ---------- capture preview: saving happens on a fresh tap, so the
   share sheet (straight to Photos) is allowed on iPhone ---------- */
const capview = document.getElementById('capview');
const capmedia = document.getElementById('capmedia');
let capBlob = null, capName = '', capType = '', capUrl = null;

function showCapture(blob, name, type, isVideo){
  capBlob = blob; capName = name; capType = type;
  if(capUrl) URL.revokeObjectURL(capUrl);
  capUrl = URL.createObjectURL(blob);
  capmedia.innerHTML = '';
  if(isVideo){
    const v = document.createElement('video');
    v.src = capUrl; v.controls = true; v.playsInline = true; v.autoplay = true;
    v.muted = true; v.loop = true;
    capmedia.appendChild(v);
  } else {
    const im = document.createElement('img');
    im.src = capUrl;
    capmedia.appendChild(im);
  }
  capview.classList.add('show');
}
function hideCapture(){
  capview.classList.remove('show');
  capmedia.innerHTML = '';
  if(capUrl){ URL.revokeObjectURL(capUrl); capUrl = null; }
  capBlob = null;
}
document.getElementById('capClose').addEventListener('click', hideCapture);
document.getElementById('capSave').addEventListener('click', async ()=>{
  if(!capBlob) return;
  await deliverCapture(capBlob, capName, capType);
  hideCapture();
});

/* phones: share sheet (straight into Photos); desktop: download */
async function deliverCapture(blob, name, type){
  const file = new File([blob], name, { type });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file] });
      return;
    }catch(e){ /* cancelled or blocked: fall through to download */ }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
}

/* ---------- video recording: the filters, filmed ---------- */
let captureMode = 'photo';
let recording = false, recorder = null, recChunks = [], recRAF = 0, recInt = 0;
const recTime = document.getElementById('recTime');

const modePhotoBtn = document.getElementById('modePhotoBtn');
const modeVideoBtn = document.getElementById('modeVideoBtn');
modePhotoBtn.addEventListener('click', ()=>{
  if(recording) return;
  captureMode = 'photo';
  modePhotoBtn.classList.add('on'); modeVideoBtn.classList.remove('on');
});
modeVideoBtn.addEventListener('click', ()=>{
  captureMode = 'video';
  modeVideoBtn.classList.add('on'); modePhotoBtn.classList.remove('on');
});

function startRec(){
  const scr = document.getElementById('screen');
  const cw = scr.clientWidth, ch = scr.clientHeight;
  if(!cw || !boothVideo.videoWidth) return;
  const dprR = window.innerWidth <= 640 ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  const rc = document.createElement('canvas');
  rc.width = cw * dprR; rc.height = ch * dprR;
  const rctx = rc.getContext('2d');
  rctx.scale(dprR, dprR);

  const mimes = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mime = mimes.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if(!mime){ recTime.textContent = 'recording unsupported'; setTimeout(()=> recTime.textContent = '', 2500); return; }

  recChunks = [];
  recorder = new MediaRecorder(rc.captureStream(30), { mimeType: mime, videoBitsPerSecond: 8000000 });
  recorder.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = ()=>{
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recChunks, { type: mime });
    showCapture(blob, `sayxit-${boothMode}-${Date.now()}.${ext}`, mime, true);
  };

  const t0 = performance.now();
  const tick = ()=>{
    if(!recording) return;
    drawComposite(rctx, cw, ch);
    recRAF = requestAnimationFrame(tick);
  };
  recording = true;
  booth.classList.add('rec');
  document.getElementById('shutter').classList.add('rec');
  recInt = setInterval(()=>{
    const s = Math.floor((performance.now() - t0) / 1000);
    recTime.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  }, 250);
  recorder.start(250);
  tick();
}

function stopRec(){
  if(!recording) return;
  recording = false;
  cancelAnimationFrame(recRAF);
  clearInterval(recInt);
  recTime.textContent = '';
  booth.classList.remove('rec');
  document.getElementById('shutter').classList.remove('rec');
  if(recorder && recorder.state !== 'inactive') recorder.stop();
}

function openBooth(){
  setMenu(false);
  document.body.classList.add('angel-open');
  startBooth();
}
document.getElementById('navBooth').addEventListener('click', openBooth);

/* ---------- video upload: same filters, your footage ---------- */
const videoFile = document.getElementById('videoFile');
const uploadBtn = document.getElementById('uploadBtn');
const cameraBtn = document.getElementById('cameraBtn');
let fileUrl = null;

uploadBtn.addEventListener('click', ()=> videoFile.click());
videoFile.addEventListener('change', ()=>{
  const f = videoFile.files && videoFile.files[0];
  if(!f) return;
  if(boothStream){
    boothStream.getTracks().forEach(tr=>tr.stop());
    boothStream = null;
  }
  if(fileUrl) URL.revokeObjectURL(fileUrl);
  fileUrl = URL.createObjectURL(f);
  boothVideo.srcObject = null;
  boothVideo.src = fileUrl;
  boothVideo.loop = true;
  boothVideo.play();
  feedMirrored = false;
  booth.classList.add('file');
  boothMsg.classList.add('off');
  boothVideo.onloadedmetadata = ()=>{
    booth.classList.add('open');
    if(reduceMotion){ booth.classList.add('live'); boothLive = true; }
    boothActive = true;
    requestAnimationFrame(sizeHalo);
    requestAnimationFrame(sizeAscii);
  };
  uploadBtn.style.display = 'none';
  cameraBtn.style.display = '';
});
cameraBtn.addEventListener('click', ()=>{
  if(fileUrl){ URL.revokeObjectURL(fileUrl); fileUrl = null; }
  boothVideo.src = '';
  boothVideo.loop = false;
  feedMirrored = true;
  booth.classList.remove('file');
  boothActive = false;
  cameraBtn.style.display = 'none';
  uploadBtn.style.display = '';
  startBooth();
});

/* ---------- character gif loop ---------- */
const charFrames = [...document.querySelectorAll('#charStack img')];
let charI = 0;
if(!reduceMotion && charFrames.length){
  setInterval(()=>{
    charFrames[charI].classList.remove('on');
    charI = (charI + 1) % charFrames.length;
    charFrames[charI].classList.add('on');
  }, 800);
}

/* ---------- signup ---------- */
const email = document.getElementById('email');
const joinBtn = document.getElementById('join');
const ok = document.getElementById('ok');
const headline = document.getElementById('headline');

const SIGNUP_URL = 'https://script.google.com/macros/s/AKfycbyn17TaSCwvkBABlSjm9wO10jd0erKKHXokmLrDD3IEEICU7eAqT8abYs8bfTiPhwg/exec';

joinBtn.addEventListener('click', async ()=>{
  const v = email.value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){
    email.style.borderColor = '#e88b7a';
    return;
  }
  joinBtn.disabled = true;
  joinBtn.textContent = 'joining…';
  try{
    await fetch(SIGNUP_URL, {
      method: 'POST',
      mode: 'no-cors', /* Apps Script accepts, browser can't read the reply — that's fine */
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ email: v, source: 'landing' })
    });
    headline.style.display = 'none';
    email.style.display = 'none';
    joinBtn.style.display = 'none';
    document.querySelectorAll('.consent').forEach(c=> c.style.display = 'none');
    ok.style.display = 'block';
  }catch(err){
    joinBtn.disabled = false;
    joinBtn.textContent = 'try again';
  }
});
