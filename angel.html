<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sayxit</title>

    <!-- Dark/Light SVG favicons -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon-dark.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="assets/favicon-light.svg" media="(prefers-color-scheme: dark)">

  <!-- PNG fallbacks -->
  <link rel="icon" type="image/png" sizes="32x32"  href="assets/favicon-dark-32.png"  media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="32x32"  href="assets/favicon-light-32.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-dark-192.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-light-192.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-dark-512.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-light-512.png" media="(prefers-color-scheme: dark)">

  <!-- iOS home screen icons -->
  <link rel="apple-touch-icon" href="assets/apple-dark-180.png"  media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="assets/apple-light-180.png" media="(prefers-color-scheme: dark)">

  <link rel="icon" type="image/x-icon" href="assets/favicon-dark.ico">


  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Helvetica', sans-serif;
    }

    /* 🎨 Background layers (same as index.html) */
    .gradient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      pointer-events: none;
      background: linear-gradient(221deg, #bcbcbc, #757575, #959595, #575757);
      background-size: 1200% 1200%;
      animation: bgShift 100s ease infinite;
    }

    @keyframes bgShift {
      0% { background-position: 54% 0%; }
      50% { background-position: 47% 100%; }
      100% { background-position: 54% 0%; }
    }

    .texture-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
      background-image: url('5c75fafe-96ba-48e0-b025-1c8059330c07.jpeg');
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      mix-blend-mode: soft-light;
    }

    .dotfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: white;
      border-radius: 50%;
      opacity: 0.05;
      animation: dotGlow 6s ease-in-out infinite;
    }

    @keyframes dotGlow {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.4; }
    }

    /* 🤍 White rectangle behind camera with breathing glow */
    .camera-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 75vw; /* adjustable size */
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
      z-index: 0;
      opacity: 0.9;
      animation: breatheGlow 10s ease-in-out infinite;
    }

    @keyframes breatheGlow {
      0%, 100% {
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
        opacity: 0.9;
      }
      50% {
        box-shadow: 0 0 80px rgba(255, 255, 255, 1);
        opacity: 1;
      }
    }

    /* 🎥 Smaller centered camera */
    #webcam {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50vw;
      height: auto;
      transform: translate(-50%, -50%) scaleX(-1);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      background: #000;
      z-index: 1;
    }

    /* ✨ Halo overlay aligned with camera */
    #overlayCanvas {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50vw;
      height: auto;
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%) scaleX(-1);
      pointer-events: none;
      z-index: 2;
    }

    /* 👁 Overlay message (hidden after camera starts) */
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, .6);
      color: #fff;
      z-index: 4;
      font: 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .overlay.hidden { display: none; }

    /* 🪶 SayXit logo — exactly as in index.html but clickable */
    .logo {
      width: 200px;
      height: auto;
      margin-bottom: 8px;
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 21;
      transition: opacity 0.3s ease;
    }

    .logo-white {
      filter: drop-shadow(0 0 1px white);
      opacity: 1;
      cursor: pointer;
    }

    a { text-decoration: none; }
  </style>
</head>
<body>
  <!-- Background layers -->
  <div class="gradient-bg"></div>
  <div class="texture-layer"></div>
  <div class="dotfield"></div>

  <!-- White rectangle behind camera -->
  <div class="camera-bg"></div>

  <!-- SayXit logo (clickable, identical to index.html) -->
  <a href="index.html">
    <img src="sayxit.png" alt="SayXit Logo" class="logo logo-white" />
  </a>

  <!-- Video + halo -->
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlayCanvas"></canvas>
  <div id="overlay" class="overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const webcam  = document.getElementById('webcam');
    const overlay = document.getElementById('overlay');
    const ocan    = document.getElementById('overlayCanvas');
    const octx    = ocan.getContext('2d');
    const headImg = new Image(); headImg.src = 'assets/head_logo.png';

    // Animated dots
    const dotContainer = document.querySelector('.dotfield');
    for (let i = 0; i < 20; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      dot.style.top = `${Math.random() * 100}%`;
      dot.style.left = `${Math.random() * 100}%`;
      dot.style.animationDelay = `${Math.random() * 10}s`;
      dotContainer.appendChild(dot);
    }

    let videoRect = { x: 0, y: 0, w: 0, h: 0 };

    function resize(){
      const DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      const vw = window.innerWidth * 0.5;
      const vh = vw * 9 / 16;
      const vx = (window.innerWidth - vw) / 2;
      const vy = (window.innerHeight - vh) / 2;
      videoRect = { x: vx, y: vy, w: vw, h: vh };
      ocan.style.width  = vw + 'px';
      ocan.style.height = vh + 'px';
      ocan.width  = Math.round(vw * DPR);
      ocan.height = Math.round(vh * DPR);
      octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    const HALO_CFG = {
      liftByHeadWidth: 0.95,
      sizeByHeadWidth: 3.50,
      smoothPosAlpha: 0.18,
      smoothScaleAlpha: 0.20,
      visibilityMin: 0.35
    };

    function updateHaloResponsive(){
      const shortSide = Math.min(videoRect.w, videoRect.h);
      if (shortSide < 500) {
        HALO_CFG.sizeByHeadWidth = 4.30;
        HALO_CFG.liftByHeadWidth = 1.05;
      } else if (shortSide < 900) {
        HALO_CFG.sizeByHeadWidth = 3.90;
        HALO_CFG.liftByHeadWidth = 1.00;
      } else {
        HALO_CFG.sizeByHeadWidth = 3.50;
        HALO_CFG.liftByHeadWidth = 0.95;
      }
    }

    function handleResize(){ resize(); updateHaloResponsive(); }
    addEventListener('resize', handleResize, { passive: true });
    handleResize();

    let __haloT0 = performance.now();
    const GLOW = {
      BLUR_MIN: 0,
      BLUR_MAX: 60,
      ALPHA_MIN: 0.35,
      ALPHA_MAX: 1.0,
      SPEED_HZ: 0.25,
      CLIP_PAD_PX: 140
    };

    const HALO_MAX_FACES = 8;
    let haloTracks = [];
    const nowMs = () => performance.now();
    const lerp = (a, b, t) => (a == null ? b : a + (b - a) * t);
    const px = v => Math.round(v);

    function matchTrack(ax, ay){
      const R = Math.max(220, Math.min(videoRect.w, videoRect.h) * 0.08);
      let best = null, bestD = 1e9;
      for (let tr of haloTracks) {
        const d = Math.hypot(tr.ax - ax, tr.ay - ay);
        if (d < bestD && d <= R) { bestD = d; best = tr; }
      }
      return best;
    }

    function pruneTracks(){
      const t = nowMs();
      haloTracks = haloTracks.filter(tr => (t - tr.lastSeen) < 450);
    }

    function drawHeads(lmsList){
      octx.clearRect(0, 0, ocan.width, ocan.height);
      if (!lmsList || !lmsList.length || !headImg.complete) { pruneTracks(); return; }

      const tNow = (performance.now() - __haloT0) * 0.001;
      const s    = Math.sin(tNow * 2 * Math.PI * GLOW.SPEED_HZ) * 0.5 + 0.5;
      const blur = GLOW.BLUR_MIN  + (GLOW.BLUR_MAX  - GLOW.BLUR_MIN)  * s;
      const alpha= GLOW.ALPHA_MIN + (GLOW.ALPHA_MAX - GLOW.ALPHA_MIN) * s;

      const faces = lmsList
        .map(lm => {
          const L = lm[127], R = lm[356];
          const headW = Math.hypot((R.x - L.x) * videoRect.w, (R.y - L.y) * videoRect.h);
          return { lm, headW };
        })
        .sort((a, b) => b.headW - a.headW)
        .slice(0, HALO_MAX_FACES);

      faces.forEach(({lm}) => {
        if (lm[10].visibility !== undefined && lm[10].visibility < HALO_CFG.visibilityMin) return;

        const L = lm[127], R = lm[356];
        const eyeL = lm[33], eyeR = lm[263];
        const headW = Math.hypot((R.x - L.x) * videoRect.w, (R.y - L.y) * videoRect.h);
        const eyeW  = Math.hypot((eyeR.x - eyeL.x) * videoRect.w, (eyeR.y - eyeL.y) * videoRect.h);
        const baseScale = headW > 0 ? headW : eyeW;

        const noseTop = lm[10];
        const browMid = lm[151] || lm[9];
        const ax = videoRect.x + ((noseTop.x + browMid.x) * 0.5) * videoRect.w;
        const ay = videoRect.y + (Math.min(noseTop.y, browMid.y)) * videoRect.h;

        const SMALL_FACE_PX = 120;
        const boost = Math.min(1.8, Math.max(1.0, SMALL_FACE_PX / Math.max(1, baseScale)));

        const size = HALO_CFG.sizeByHeadWidth * baseScale * boost;
        const lift = HALO_CFG.liftByHeadWidth * baseScale * (0.9 + 0.1 * boost);

        const tw = size;
        const th = tw * (headImg.height / headImg.width);
        const tx = ax - tw / 2;
        const ty = (ay - lift) - th / 2;

        let tr = matchTrack(ax, ay);
        const posA   = baseScale < SMALL_FACE_PX ? HALO_CFG.smoothPosAlpha * 0.7 : HALO_CFG.smoothPosAlpha;
        const scaleA = baseScale < SMALL_FACE_PX ? HALO_CFG.smoothScaleAlpha * 0.7 : HALO_CFG.smoothScaleAlpha;

        if (!tr) {
          tr = { x: tx, y: ty, w: tw, h: th, scale: baseScale, lastSeen: nowMs(), ax, ay };
          haloTracks.push(tr);
          if (haloTracks.length > HALO_MAX_FACES) haloTracks.shift();
        } else {
          tr.scale = lerp(tr.scale, baseScale, scaleA);
          tr.w     = lerp(tr.w, tw, scaleA);
          tr.h     = lerp(tr.h, th, scaleA);
          tr.x     = lerp(tr.x, tx, posA);
          tr.y     = lerp(tr.y, ty, posA);
          tr.ax    = lerp(tr.ax, ax, posA);
          tr.ay    = lerp(tr.ay, ay, posA);
          tr.lastSeen = nowMs();
        }

        const X = px(tr.x - videoRect.x);
        const Y = px(tr.y - videoRect.y);
        const W = px(tr.w);
        const H = px(tr.h);

        octx.save();
        const pad = GLOW.CLIP_PAD_PX;
        octx.beginPath();
        octx.rect(X - pad, Y - pad, W + 2 * pad, H + 2 * pad);
        octx.clip();

        octx.translate(X + W / 2, 0);
        octx.scale(-1, 1);

        octx.shadowColor = `rgba(255,255,255,${alpha.toFixed(3)})`;
        octx.shadowBlur  = blur;
        octx.globalAlpha = 1.0;
        octx.drawImage(headImg, -W / 2, Y, W, H);

        octx.shadowBlur = 0;
        octx.shadowColor = 'transparent';
        octx.drawImage(headImg, -W / 2, Y, W, H);

        octx.restore();
      });

      pruneTracks();
    }

    async function startCamera(){
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode:'user', width:{ideal:1280}, height:{ideal:720} },
          audio:false
        });
        webcam.srcObject = stream;
        await webcam.play();
        overlay.classList.add('hidden');
        webcam.style.display = '';
        ocan.style.transform = 'translate(-50%, -50%) scaleX(-1)';
        initFace();
      } catch(e){
        window.location.href = "index.html";
      }
    }

    function initFace(){
      const faceMesh = new FaceMesh({ locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
      faceMesh.setOptions({
        maxNumFaces: 8,
        refineLandmarks: true,
        minDetectionConfidence: 0.30,
        minTrackingConfidence: 0.40
      });
      const cam = new Camera(webcam,{
        onFrame: async()=>{ await faceMesh.send({ image: webcam }); },
        width: 1280, height: 720
      });
      cam.start();
      faceMesh.onResults((res)=>{
        if(res.multiFaceLandmarks && res.multiFaceLandmarks.length){
          drawHeads(res.multiFaceLandmarks);
        }else{
          octx.clearRect(0,0,ocan.width,ocan.height);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
